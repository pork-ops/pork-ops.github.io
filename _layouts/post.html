---
layout: default
---
<article class="post h-entry">
  <header class="post-header">
    <p class="post-card__meta">{{ page.date | date: "%d %b %Y" }} · {{ page.categories | join: " / " }}</p>
    <h1 class="post-title p-name">{{ page.title }}</h1>
    {% if page.translation_url %}<a class="translation-link" data-switch-language="{% if page.lang == 'en' %}es{% else %}en{% endif %}" href="{{ page.translation_url | relative_url }}"><span data-lang="en">Leer en español →</span><span data-lang="es">Leer en inglés →</span></a>{% endif %}
  </header>
  <div class="post-content e-content">{{ content }}</div>
</article>

<!doctype html>
<html lang="{{ page.lang | default: site.default_lang | default: 'en' }}" data-language="{{ page.lang | default: site.default_lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper site-header__inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"><span data-lang="en">Home</span><span data-lang="es">Inicio</span></a>
          <a href="{{ '/about' | relative_url }}"><span data-lang="en">About</span><span data-lang="es">Sobre mí</span></a>
          <div class="language-switcher" aria-label="Language">
            <button type="button" data-set-language="en">EN</button>
            <span aria-hidden="true">/</span>
            <button type="button" data-set-language="es">ES</button>
          </div>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper"><span data-lang="en">Built with Markdown and GitHub Pages.</span><span data-lang="es">Hecho con Markdown y GitHub Pages.</span></div>
    </footer>
    <script src="{{ '/assets/language.js' | relative_url }}"></script>
  </body>
</html>
